<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bricks">
<title>Brick Breaker</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #181a33;
    --text: #e8e9f3;
    --muted: #9a9cc0;
    --accent: #ffcc4d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100dvh;
    padding:
      max(8px, env(safe-area-inset-top))
      max(8px, env(safe-area-inset-right))
      max(8px, env(safe-area-inset-bottom))
      max(8px, env(safe-area-inset-left));
    gap: 8px;
  }
  #bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.08em; }
  #pause {
    min-width: 44px;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: #2a2d55;
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    touch-action: manipulation;
    cursor: pointer;
  }
  #pause:disabled { opacity: 0.35; cursor: default; }
  #stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: var(--panel);
    border-radius: 10px;
    touch-action: none;
  }
  @media (pointer: fine) { canvas { cursor: none; } }
  .help { margin: 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
  .touch-help { display: none; }
  @media (pointer: coarse) {
    .key-help { display: none; }
    .touch-help { display: block; }
  }
  /* Landscape phones: give the playfield all the height, pause button at the side */
  @media (max-height: 500px) {
    .help, h1 { display: none; }
    body { flex-direction: row-reverse; align-items: stretch; }
    #bar { width: auto; flex-direction: column; justify-content: flex-start; }
  }
  kbd {
    background: #2a2d55;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div id="bar">
    <h1>BRICK BREAKER</h1>
    <button id="pause" type="button" aria-label="Pause" disabled>❚❚</button>
  </div>
  <div id="stage"><canvas id="game"></canvas></div>
  <p class="help key-help">
    Move: <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> / mouse ·
    Launch: <kbd>Space</kbd> / click ·
    Pause: <kbd>P</kbd>
  </p>
  <p class="help touch-help">Drag anywhere to move the paddle · Tap to launch</p>
<script src="game.js"></script>
</body>
</html>
